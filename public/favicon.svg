<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="favSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Background Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0F172A" />

  <!-- Vitality Ring Arc -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#favEmerald)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="85 30" />
  
  <!-- Intertwined Telemetry Arc -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="url(#favSky)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="55 25" transform="rotate(180 32 32)" />

  <!-- Center Biometric Node -->
  <circle cx="32" cy="32" r="3.5" fill="#34D399" />
</svg>
