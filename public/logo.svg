<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="dnaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- EMBLEM GROUP -->
  <g transform="translate(140, 150)">
    <!-- Outer Ring Left (Green Leaf Arc) -->
    <path d="M -110,-20 A 115,115 0 0,1 -20,-115" fill="none" stroke="url(#greenGrad)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Outer Ring Top-Right (Sky Blue Arc) -->
    <path d="M -10,-118 A 115,115 0 0,1 115,0" fill="none" stroke="url(#blueGrad)" stroke-width="10" stroke-linecap="round" />

    <!-- Bottom Cradling Hand -->
    <path d="M -110,30 C -100,95 -40,118 10,118 C 60,118 105,95 110,65 C 112,58 105,55 95,65 C 75,85 30,95 -10,95 C -45,95 -80,75 -95,40 C -100,28 -108,22 -110,30 Z" fill="url(#handGrad)" />

    <!-- Leaves on Left -->
    <path d="M -115,10 C -145,-10 -130,-50 -95,-45 C -85,-20 -95,5 -115,10 Z" fill="#22C55E" />
    <path d="M -125,50 C -150,35 -145,5 -115,0 C -105,20 -110,40 -125,50 Z" fill="#16A34A" />

    <!-- Human Figure (Green) -->
    <!-- Head -->
    <circle cx="-35" cy="-55" r="14" fill="#15803D" />
    <!-- Body & Arms Outstretched -->
    <path d="M -75,-65 C -55,-40 -45,-30 -35,-15 C -25,-30 -15,-45 -5,-65 C -2,-70 5,-65 -2,-55 C -15,-35 -25,-15 -30,20 C -32,28 -38,28 -40,20 C -45,-15 -55,-35 -70,-55 C -75,-65 -78,-70 -75,-65 Z" fill="url(#greenGrad)" />

    <!-- DNA Double Helix (Right Side) -->
    <g fill="none" stroke="url(#dnaGrad)" stroke-linecap="round">
      <!-- Strand 1 -->
      <path d="M 25,-75 C 50,-55 50,-35 25,-15 C 0,5 0,25 25,45 C 50,65 50,85 25,105" stroke-width="6" />
      <!-- Strand 2 -->
      <path d="M 45,-75 C 20,-55 20,-35 45,-15 C 70,5 70,25 45,45 C 20,65 20,85 45,105" stroke-width="6" />
      
      <!-- Base Pairs (Rungs) -->
      <line x1="27" y1="-65" x2="43" y2="-65" stroke="#8B5CF6" stroke-width="4" />
      <line x1="34" y1="-45" x2="34" y2="-45" stroke="#38BDF8" stroke-width="6" />
      <line x1="27" y1="-25" x2="43" y2="-25" stroke="#8B5CF6" stroke-width="4" />
      <line x1="35" y1="-5" x2="35" y2="-5" stroke="#38BDF8" stroke-width="6" />
      <line x1="27" y1="15" x2="43" y2="15" stroke="#8B5CF6" stroke-width="4" />
      <line x1="35" y1="35" x2="35" y2="35" stroke="#38BDF8" stroke-width="6" />
      <line x1="27" y1="55" x2="43" y2="55" stroke="#8B5CF6" stroke-width="4" />
      <line x1="35" y1="75" x2="35" y2="75" stroke="#38BDF8" stroke-width="6" />
      <line x1="27" y1="95" x2="43" y2="95" stroke="#8B5CF6" stroke-width="4" />
    </g>
  </g>

  <!-- TEXT GROUP -->
  <g transform="translate(290, 160)">
    <!-- "Lifestyle" Text (Green) -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="82" font-weight="800" fill="#2E7D32" letter-spacing="-1">Lifestyle</text>
    
    <!-- "Bio" Text (Sky Blue) -->
    <text x="315" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="82" font-weight="800" fill="#38BDF8" letter-spacing="-1">Bio</text>
    
    <!-- Leaf on top of 'i' in Bio -->
    <path d="M 378,-68 C 378,-82 390,-88 398,-88 C 398,-74 388,-68 378,-68 Z" fill="#22C55E" />

    <!-- Tagline Divider Line Left -->
    <line x1="2" y1="42" x2="45" y2="42" stroke="#2E7D32" stroke-width="3" stroke-linecap="round" />

    <!-- Tagline Text -->
    <text x="58" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#374151" letter-spacing="4.5">LIVE HEALTHY. LIVE BETTER. LIVE LONGER.</text>
    
    <!-- Tagline Divider Line Right -->
    <line x1="495" y1="42" x2="538" y2="42" stroke="#2E7D32" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
