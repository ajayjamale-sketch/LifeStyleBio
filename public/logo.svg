<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="bioTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="60%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#10B981" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ICON EMBLEM GROUP -->
  <g transform="translate(18, 14)" filter="url(#glowFilter)">
    <!-- Outer Shield / Vitality Outline with Transparent Backing -->
    <rect x="6" y="6" width="100" height="100" rx="28" fill="none" stroke="#CBD5E1" stroke-width="2" opacity="0.6" />
    
    <!-- Primary Emerald Vitality Orbit Ring -->
    <path 
      d="M 56,18 C 78,18 94,34 94,56 C 94,76 80,92 60,94 C 54,94.5 50,91 50,86 C 50,81.5 53.5,78 58,77.5 C 70,76 78,67 78,56 C 78,44 68,34 56,34 C 44,34 34,44 34,56 C 34,62 36.5,67.5 40.5,71.5 C 44,75 44,80 40,83.5 C 36.5,87 31,86 28,82 C 22,75 18,66 18,56 C 18,34 34,18 56,18 Z" 
      fill="url(#emeraldGrad)" 
    />

    <!-- Secondary Sky Cyber Telemetry Curve (Intertwined) -->
    <path 
      d="M 56,94 C 34,94 18,78 18,56 C 18,48 21,41 26,35 C 29.5,31 35,32 37.5,36 C 40,40 39,45.5 35.5,49 C 34.5,50.5 34,53 34,56 C 34,68 44,78 56,78 C 65,78 72.5,72.5 76,64.5 C 78,60.5 83,58.5 87,60.5 C 91.5,62.5 93,68 90,72 C 83.5,85 71,94 56,94 Z" 
      fill="url(#skyGrad)" 
    />

    <!-- Central DNA Telemetry Pulse Core -->
    <path 
      d="M 32,56 L 44,56 L 49,42 L 56,72 L 63,47 L 68,59 L 80,59" 
      fill="none" 
      stroke="url(#purpleGrad)" 
      stroke-width="4.5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Biometric Core Nodes -->
    <circle cx="56" cy="56" r="4" fill="#10B981" />
    <circle cx="56" cy="56" r="7" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.75" />
    <circle cx="49" cy="42" r="3" fill="#38BDF8" />
    <circle cx="63" cy="47" r="3" fill="#8B5CF6" />
  </g>

  <!-- TYPOGRAPHY / WORDMARK GROUP -->
  <g transform="translate(142, 75)">
    <!-- "Lifestyle" Wordmark -->
    <text 
      x="0" 
      y="0" 
      font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
      font-size="46" 
      font-weight="800" 
      fill="#0F172A" 
      letter-spacing="-1.2px"
    >
      Lifestyle
    </text>

    <!-- "Bio" Wordmark -->
    <text 
      x="196" 
      y="0" 
      font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
      font-size="46" 
      font-weight="800" 
      fill="url(#bioTextGrad)" 
      letter-spacing="-0.8px"
    >
      Bio
    </text>

    <!-- Glowing Pulse Node over 'i' in Bio -->
    <circle cx="236.5" cy="-38" r="4.5" fill="#10B981" />
    <circle cx="236.5" cy="-38" r="8" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.6" />

    <!-- Subtitle / Clinical Tagline -->
    <g transform="translate(2, 28)">
      <text 
        x="0" 
        y="0" 
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-size="10" 
        font-weight="700" 
        fill="#64748B" 
        letter-spacing="3.8px"
      >
        PRECISION HEALTHSPAN &amp; LONGEVITY OS
      </text>

      <!-- Micro Biometric Indicator Badge -->
      <g transform="translate(372, -9)">
        <rect x="0" y="0" width="30" height="12" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
        <text x="5" y="8.5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="7" font-weight="800" fill="#059669">AI-24</text>
      </g>
    </g>
  </g>
</svg>
