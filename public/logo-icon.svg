<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="iconEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="iconSkyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="iconPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#10B981" flood-opacity="0.25" />
    </filter>
  </defs>

  <g transform="translate(10, 10)" filter="url(#iconGlow)">
    <!-- Container Card -->
    <rect x="0" y="0" width="180" height="180" rx="46" fill="#0F172A" />
    <rect x="0" y="0" width="180" height="180" rx="46" fill="none" stroke="url(#iconEmeraldGrad)" stroke-width="2.5" opacity="0.35" />

    <!-- Ambient Glow in Background -->
    <circle cx="90" cy="90" r="50" fill="#10B981" opacity="0.08" />

    <!-- Primary Emerald Vitality Orbit Ring -->
    <path 
      d="M 90,32 C 122,32 148,58 148,90 C 148,118 128,142 98,146 C 89,147 83,142 83,134 C 83,127 88,122 95,121 C 114,119 126,106 126,90 C 126,72 110,56 90,56 C 70,56 54,72 54,90 C 54,100 58,108 64,115 C 69,120 69,128 63,134 C 57,140 48,138 43,132 C 34,121 28,106 28,90 C 28,58 58,32 90,32 Z" 
      fill="url(#iconEmeraldGrad)" 
    />

    <!-- Secondary Sky Cyber Telemetry Curve (Intertwined) -->
    <path 
      d="M 90,148 C 58,148 32,122 32,90 C 32,78 37,67 45,58 C 50,52 59,54 63,60 C 67,66 65,75 60,80 C 58,82 57,86 57,90 C 57,108 72,124 90,124 C 104,124 116,116 122,103 C 125,97 133,94 139,97 C 146,100 148,109 143,115 C 133,135 113,148 90,148 Z" 
      fill="url(#iconSkyGrad)" 
    />

    <!-- Central DNA Telemetry Pulse Core -->
    <path 
      d="M 52,90 L 71,90 L 79,68 L 90,114 L 101,76 L 109,95 L 128,95" 
      fill="none" 
      stroke="url(#iconPurpleGrad)" 
      stroke-width="7" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Biometric Core Nodes -->
    <circle cx="90" cy="90" r="6" fill="#10B981" />
    <circle cx="90" cy="90" r="11" fill="none" stroke="#38BDF8" stroke-width="2.5" opacity="0.85" />
    <circle cx="79" cy="68" r="4.5" fill="#38BDF8" />
    <circle cx="101" cy="76" r="4.5" fill="#8B5CF6" />
  </g>
</svg>
